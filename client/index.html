<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          var str = String(msg || '');
          if (str.indexOf('startTime') !== -1 || str.indexOf('reportAllChanges') !== -1 || !url || url.indexOf('chrome-extension') !== -1) {
            return true;
          }
          if (origOnError) return origOnError.apply(this, arguments);
        };
        window.addEventListener('error', function(e) {
          var m = String(e.message || '');
          if (m.indexOf('startTime') !== -1 || m.indexOf('reportAllChanges') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honey Chain — Blockchain Traceability & Smart Beekeeping</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0f0d0b] text-stone-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-amber-500 selection:text-stone-950 min-h-screen flex flex-col">
    <div id="root" class="flex flex-col min-h-screen"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
