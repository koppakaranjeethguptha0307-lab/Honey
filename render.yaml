services:
  - type: web
    name: honey-chain-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/honeychain.sqlite
    disk:
      name: honey-chain-data
      mountPath: /var/data
      sizeGB: 1
